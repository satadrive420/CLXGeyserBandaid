# CLXGeyserBandaid Configuration

# Target Players Setting
# Controls which players the plugin's combat fixes apply to
# Options:
#   bedrock-only - Only apply fixes to Bedrock players (connected via Floodgate)
#   all          - Apply fixes to all players (both Java and Bedrock)
# Default: bedrock-only
target-players: bedrock-only

# Block Mending on Elytras in Combat
# Prevents mending enchantment from repairing elytras while a player is in combat
# Default: true
block-elytra-mending-in-combat: true

